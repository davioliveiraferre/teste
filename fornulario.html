
<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faça sua reserva</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="galeria.html">Acomodações</a>
            <a href="atra.html">Atrações</a>
            <a href="">Galeria</a>
            <a href="">Sobre</a>
            <a href="">Contato</a>
            <a class="especialreserva" href="">Reservar agora</a>
        </nav>
    </header>

    <main>

        <section class="reserva">

            <h1>Faça sua reserva</h1>

            <form id="formReserva">

                <label for="nome">Nome</label>
                <input type="text" id="nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" required>

                <label for="entrada">Data de hospedagem</label>
                <input type="date" id="entrada" required>

                <fieldset>
                    <legend>Gênero</legend>

                    <input type="radio" name="genero" id="masculino" value="Masculino" required>
                    <label for="masculino">Masculino</label>

                    <input type="radio" name="genero" id="feminino" value="Feminino">
                    <label for="feminino">Feminino</label>

                    <input type="radio" name="genero" id="outro" value="Outro">
                    <label for="outro">Outro</label>

                    <input type="radio" name="genero" id="naoInformar" value="Prefiro não informar">
                    <label for="naoInformar">Prefiro não informar</label>

                </fieldset>

                <label for="quarto">Suíte escolhida</label>

                <select id="quarto" required>
                    <option value="">Selecione a suíte</option>
                    <option value="350">Quarto Aconchegante</option>
                    <option value="520">Suíte Romântica</option>
                    <option value="430">Chalé da Serra</option>
                    <option value="680">Chalé Premium</option>
                    <option value="470">Refúgio com Piscina</option>
                    <option value="550">Experiência Natureza</option>
                    <option value="750">Refúgio Família</option>
                    <option value="890">Experiência Premium</option>
                </select>

                <label for="diarias">Número de diárias</label>
                <input type="number" id="diarias" min="1" required>

                <fieldset>
                    <legend>Adicionais</legend>

                    <input type="checkbox" id="cafe" value="40">
                    <label for="cafe">Café da manhã (R$ 40)</label>

                    <input type="checkbox" id="almoco" value="60">
                    <label for="almoco">Almoço (R$ 60)</label>

                    <input type="checkbox" id="jantar" value="70">
                    <label for="jantar">Jantar (R$ 70)</label>

                </fieldset>

                <button type="submit">Enviar</button>

            </form>

            <div id="orcamento" aria-live="polite">

                <h2>Prévia do orçamento</h2>

                <p id="hospedagem">Hospedagem: R$ 0,00</p>

                <p id="adicionais">Adicionais: R$ 0,00</p>

                <h2 id="valorFinal">TOTAL A PAGAR: R$ 0,00</h2>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Refúgio da Serra. Todos os direitos reservados.</p>
    </footer>

    <script src="js/confijs.js"></script>

</body>
</html>
